<text class="tiny" x="98" y="104" text-anchor="end">23.68</text>
<text class="tiny" x="98" y="430" text-anchor="end">0.00</text>
<text class="small" x="18" y="265.0" text-anchor="middle" transform="rotate(-90 18 265.0)">2 log Λ</text>
<circle cx="351.0" cy="392.290287825539" r="5" fill="#777777"/>
<text class="small" x="363.0" y="396.290287825539">p50: 2.71</text>
<circle cx="351.0" cy="357.88106525254443" r="5" fill="#777777"/>
