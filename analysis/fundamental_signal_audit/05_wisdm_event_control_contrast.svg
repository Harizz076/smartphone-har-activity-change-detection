<text class="label" x="525.0" y="525" text-anchor="middle">Only 2/12 label boundaries exceed the matched control 95th percentile (12.68).</text>
<text class="small" x="525.0" y="552" text-anchor="middle">The labeled switch is not cleanly separable from normal within-activity stair oscillation by a raw mean shift.</text>
<text class="tiny" x="525.0" y="590" text-anchor="middle">Controls: same three users and stair labels, regular timing, fixed boundaries sampled every 1 s. Observations are temporally dependent.</text>
