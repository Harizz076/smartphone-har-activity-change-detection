<text class="title" x="525.0" y="28" text-anchor="middle">Do WISDM label boundaries look more unusual than ordinary stair motion?</text>
<text class="small" x="525.0" y="49" text-anchor="middle">Maximum exact mean-shift GLRT across x, y, z, and magnitude; 0.5 s on each side</text>
<rect x="105" y="100" width="820" height="330" fill="#fafafa" stroke="#777"/>
<line class="grid" x1="105" y1="182.5" x2="925" y2="182.5"/>
