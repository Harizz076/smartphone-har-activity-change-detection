<text class="small" x="351.0" y="480" text-anchor="middle">n=691</text>
<circle cx="695.4" cy="389.5339663339684" r="5" fill="#D55E00"/>
<text class="small" x="707.4" y="393.5339663339684">p50: 2.90</text>
<circle cx="695.4" cy="371.8335838493949" r="5" fill="#D55E00"/>
