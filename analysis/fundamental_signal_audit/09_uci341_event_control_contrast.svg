<text class="small" x="615.0" y="610" text-anchor="middle">The event score is optimistic because it takes the best of three label-derived landmarks; deployment must scan without labels.</text>
<text class="tiny" x="615.0" y="638" text-anchor="middle">Controls span standing, sitting, and lying; repeated controls within streams are not independent.</text>
